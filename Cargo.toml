[package]
name = "homography"
version = "0.2.0"
edition = "2021"
description = "Homography estimation using point and line correspondences"
authors = ["Eduardo González <edugonzalezvaq@gmail.com>"]
repository = "https://github.com/edugzlez/homography-rs"
license = "MIT"

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
